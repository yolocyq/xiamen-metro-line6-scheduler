<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>厦门地铁6号线 · 智能排班系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo"><b>6</b></span>
      <div>
        <div class="title">厦门地铁 <b>6号线</b> · 智能排班</div>
        <div class="sub" id="periodLabel">排班周期加载中…</div>
      </div>
    </div>
    <div class="stats" id="topStats"></div>
    <div class="actions">
      <button id="btnExtToggleTop" class="btn accent">📅 延续周期</button>
      <button id="btnGenerate" class="btn primary">⚡ 生成 / 确认排班</button>
      <div class="export-wrap">
        <button id="btnExport" class="btn">⬇ 导出 ▾</button>
        <div id="exportMenu" class="export-menu" style="display:none">
          <button data-exp="shift">📋 排班班表</button>
          <button data-exp="result">📊 月结果考勤报表</button>
          <button data-exp="matrix">🗓 月考勤排班报表</button>
        </div>
      </div>
      <button id="btnReset" class="btn ghost">↺ 重置示例</button>
    </div>
  </header>

  <div class="watermark" aria-hidden="true">程有权　钱杨芯</div>

  <nav class="tabs">
    <button class="tab active" data-tab="schedule">📋 排班总表</button>
    <button class="tab" data-tab="people">👥 人员管理</button>
    <button class="tab" data-tab="changes">✏ 变动登记</button>
    <button class="tab" data-tab="alerts">⚠ 告警中心 <span id="alertBadge" class="badge">0</span></button>
  </nav>

  <main>
    <!-- 排班总表 -->
    <section id="tab-schedule" class="panel active">
      <div class="toolbar">
        <label>车站/分组：
          <select id="sectionFilter"></select>
        </label>
        <label>在岗状态：
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="onduty">在岗</option>
            <option value="leave">未在岗-休假</option>
            <option value="train">未在岗-培训</option>
            <option value="other">未在岗-其他（借调/跟岗等）</option>
          </select>
        </label>
        <label><input type="checkbox" id="onlyChanged" /> 仅看本次变动</label>
        <label>搜索：
          <input type="search" id="schedSearch" placeholder="姓名/工号…" />
        </label>
        <button id="btnExtToggle" class="btn sm">📅 延续周期</button>
        <span class="legend">
          <i class="lg normal"></i>正常 <i class="lg rest"></i>休息
          <i class="lg leave"></i>本人休假 <i class="lg sub"></i>顶替外出 <i class="lg swap"></i>换班顶岗
          <i class="lg warn"></i>缺口 <span class="gd" style="background:#7c3aed"></span>班组色标
        </span>
      </div>
      <div class="ext-bar" id="extBar" style="display:none">
        <span class="ext-title">📅 周期延续</span>
        <label>延续 <input type="number" id="extWeeks" value="1" min="1" max="12" /> 个周期（每周期8天）</label>
        <label class="chk"><input type="checkbox" id="extKeep" /> 复用原周期休假/顶替标注</label>
        <button id="btnExtend" class="btn primary sm">延伸并生成</button>
        <button id="btnExtReset" class="btn ghost sm">回到原周期</button>
        <span id="extInfo" class="ext-info"></span>
      </div>
      <div id="scheduleArea" class="schedule-area"></div>
    </section>

    <!-- 人员管理 -->
    <section id="tab-people" class="panel">
      <div class="toolbar">
        <label>性质：
          <select id="peopleType">
            <option value="">全部</option>
            <option value="备班">备班</option>
            <option value="普通">正岗</option>
          </select>
        </label>
        <label>角色：
          <select id="peopleRole">
            <option value="">全部</option>
            <option>值站</option><option>行值</option><option>站务员</option><option>管理</option>
          </select>
        </label>
        <label>搜索：
          <input type="search" id="peopleSearch" placeholder="姓名/工号/岗位…" />
        </label>
        <span class="bulk-hour">
          <label>一键设工时制：
            <select id="bulkHourRole">
              <option value="">全部角色</option>
              <option>值站</option><option>行值</option><option>站务员</option><option>管理</option>
            </select>
          </label>
          <select id="bulkHourSystem">
            <option>标准工时制</option><option>综合计算工时制</option><option>不定时工作制</option>
          </select>
          <button id="btnBulkHour" class="btn sm primary">应用</button>
        </span>
      </div>
      <div id="peopleArea" class="people-area"></div>
    </section>

    <!-- 变动登记 -->
    <section id="tab-changes" class="panel">
      <div class="change-grid">
        <div class="card">
          <h3>① 登记休假 / 抽离</h3>
          <div class="form-row">
            <label>人员 <select id="chgPerson"></select></label>
          </div>
          <div class="form-row">
            <label>类型
              <select id="chgLeave"></select>
            </label>
          </div>
          <div class="form-row" id="chgDates"></div>
          <button id="btnAddLeave" class="btn primary">＋ 登记变动</button>
        </div>
        <div class="card">
          <h3>② 登记换班 / 顶岗</h3>
          <p class="hint" style="margin:0 0 8px">员工私下换班也请在此登记，班表与月考勤报表将如实体现，避免人为修改。</p>
          <div class="form-row">
            <label>被顶岗人 <select id="chgSwapPerson"></select></label>
          </div>
          <div class="form-row">
            <label>顶岗人（替TA上班） <select id="chgSwapBy"></select></label>
          </div>
          <div class="form-row" id="swapDates"></div>
          <button id="btnAddSwap" class="btn primary">＋ 登记换班</button>
        </div>
        <div class="card">
          <h3>③ 已登记变动</h3>
          <div id="overrideList" class="override-list"></div>
          <p class="hint">登记后点击右上角「⚡ 生成 / 确认排班」即可自动顶替。双向换班请登记两条（各选对方为顶岗人）。</p>
        </div>
      </div>
    </section>

    <!-- 告警中心 -->
    <section id="tab-alerts" class="panel">
      <div id="alertArea" class="alert-area"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="engine.js"></script>
  <script src="seedc.js"></script>
  <script src="app.js"></script>
</body>
</html>
